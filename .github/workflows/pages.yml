name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published, edited]
  # 不设定时部署：网站只在网站文件变更、发布 Release 或手动触发时发布。
  # 定时部署只为刷新 Star 快照，却每小时产生一次部署和偶发的 artifact 竞态失败通知。

permissions:
  contents: read

concurrency:
  group: writer-desk-pages
  cancel-in-progress: false

jobs:
  refresh-release:
    name: Refresh website after publication
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the current main website with published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  deploy:
    name: Deploy website to GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Refresh public update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tests/verify_update_feed.py
          python3 scripts/generate-update-feed.py website/updates.json
      - name: Refresh public Star snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          repository = "asoming/writer-desk"
          result = subprocess.run(
              ["gh", "api", f"repos/{repository}", "--jq",
               "{repository: .full_name, count: .stargazers_count, private: .private}"],
              check=True, capture_output=True, text=True,
          )
          metadata = json.loads(result.stdout)
          count = metadata.get("count")
          updated_at = time.time_ns() // 1_000_000
          max_safe_integer = 2**53 - 1
          if metadata.get("repository") != repository or metadata.get("private") is not False:
              raise ValueError("Star snapshot must refer to the expected public repository")
          if type(count) is not int or not 0 <= count <= max_safe_integer:
              raise ValueError("Invalid Star count")
          if not 0 < updated_at <= max_safe_integer:
              raise ValueError("Invalid snapshot timestamp")
          snapshot = {"repository": repository, "count": count, "updatedAt": updated_at}
          Path("website/github-stars.json").write_text(
              json.dumps(snapshot, indent=2) + "\n", encoding="utf-8",
          )
          PY
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        # Pages 刚上传的 artifact 偶尔还没被索引，deploy-pages 会立刻报
        #   No artifacts named "github-pages" were found for this workflow run
        # 这一步允许失败后重试一次，避免整个 run 标红并发出失败通知。
        continue-on-error: true
      - name: Wait for the uploaded Pages artifact to be indexed
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Deploy again when the Pages artifact was not indexed yet
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
