name: Native desktop packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from package.json (for example 0.8.8)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: writer-desk-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: windows-2022
            platform: win32
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - name: Verify requested version and native architecture
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'const p = require("./package.json"); if (p.version !== process.env.EXPECTED_VERSION || process.arch !== process.env.EXPECTED_ARCH) throw Error("Package version or native Node architecture mismatch")'
      - name: Install locked build dependencies
        run: |
          npm ci
          python -m pip install -r scripts/requirements-build.txt
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox desktop-file-utils libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 libsecret-1-0 libnotify4
      - name: Native packaging and macOS window contracts
        # Keep the dense layout CPU budget deterministic on native CI runners.
        run: node --test --test-concurrency=1 tests/*.test.js tests/*.test.cjs
      - name: Windows update helper readiness and re-verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node tests/update-installer-native.cjs --report dist/update-installer-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Electron resolves/downloads its executable lazily. Resolve the
          # package API first, then wait for its real exit status through Node.
          node -e 'const electron = require("electron"); const result = require("node:child_process").spawnSync(electron, ["tests/update-installer-native.cjs", "--report", "dist/update-installer-electron.json"], { env: { ...process.env, ELECTRON_RUN_AS_NODE: "1" }, stdio: "inherit", timeout: 120000 }); if (result.error) throw result.error; process.exit(Number.isInteger(result.status) ? result.status : 1);'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real editor typing and IME regression on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a env WRITER_TEST_WINDOW_MANAGER=openbox node node_modules/electron/cli.js --no-sandbox tests/immersive-native-electron.cjs --report dist/immersive-native-regression.json
          xvfb-run -a env WRITER_TEST_WINDOW_MANAGER=openbox node node_modules/electron/cli.js --no-sandbox tests/immersive-writing-electron.cjs --capture --report dist/immersive-writing-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/editor-layout-electron.cjs --report dist/editor-layout-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/review-jump-electron.cjs --report dist/review-jump-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/editor-tools-electron.cjs --report dist/editor-tools-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/formatted-export-electron.cjs --report dist/formatted-export-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/expansion-workflow-electron.cjs --compact --report dist/expansion-workflow-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/home-dashboard-electron.cjs --compact --report dist/home-dashboard-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/interface-polish-electron.cjs --report dist/interface-polish-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/comparison-drafts-electron.cjs --report dist/comparison-drafts-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/character-growth-electron.cjs --report dist/character-growth-regression.json
          xvfb-run -a node node_modules/electron/cli.js --no-sandbox tests/skills-workflow-electron.cjs --report dist/skills-workflow-regression.json
      - name: Real editor typing and IME regression on Windows and macOS
        if: runner.os != 'Linux'
        shell: bash
        run: |
          node node_modules/electron/cli.js tests/immersive-native-electron.cjs --report dist/immersive-native-regression.json
          node node_modules/electron/cli.js tests/immersive-writing-electron.cjs --report dist/immersive-writing-regression.json
          node node_modules/electron/cli.js tests/editor-layout-electron.cjs --report dist/editor-layout-regression.json
          node node_modules/electron/cli.js tests/review-jump-electron.cjs --report dist/review-jump-regression.json
          node node_modules/electron/cli.js tests/editor-tools-electron.cjs --report dist/editor-tools-regression.json
          node node_modules/electron/cli.js tests/formatted-export-electron.cjs --report dist/formatted-export-regression.json
          node node_modules/electron/cli.js tests/expansion-workflow-electron.cjs --report dist/expansion-workflow-regression.json
          node node_modules/electron/cli.js tests/home-dashboard-electron.cjs --report dist/home-dashboard-regression.json
          node node_modules/electron/cli.js tests/interface-polish-electron.cjs --report dist/interface-polish-regression.json
          node node_modules/electron/cli.js tests/comparison-drafts-electron.cjs --report dist/comparison-drafts-regression.json
          node node_modules/electron/cli.js tests/character-growth-electron.cjs --report dist/character-growth-regression.json
          node node_modules/electron/cli.js tests/skills-workflow-electron.cjs --report dist/skills-workflow-regression.json
      - name: Native storage and lifecycle regression tests
        run: python scripts/test-native.py
      - name: Linux desktop and updater contracts
        if: runner.os == 'Linux'
        run: |
          npm run test:desktop
          node scripts/test-updater.cjs
      - name: Build native installer and checksum
        run: node scripts/build-native.cjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Frozen manuscript import and review workflow
        run: python -c "import pathlib, subprocess, sys; service = pathlib.Path('build/backend') / ('writer-service.exe' if sys.platform == 'win32' else 'writer-service'); subprocess.run([sys.executable, 'tests/verify_review_workflow.py', '--service', str(service.resolve())], check=True)"
      - name: Frozen workspace expansion and synchronization routes
        run: python -c "import pathlib, subprocess, sys; service = pathlib.Path('build/backend') / ('writer-service.exe' if sys.platform == 'win32' else 'writer-service'); subprocess.run([sys.executable, 'tests/verify_extensions_api.py', '--service', str(service.resolve())], check=True)"
      - name: Frozen homepage statistics, settings and resources
        run: python -c "import pathlib, subprocess, sys; service = pathlib.Path('build/backend') / ('writer-service.exe' if sys.platform == 'win32' else 'writer-service'); subprocess.run([sys.executable, 'tests/verify_home_dashboard.py', '--service', str(service.resolve())], check=True)"
      - name: Frozen immersive writing sessions and homepage persistence
        run: python -c "import pathlib, subprocess, sys; service = pathlib.Path('build/backend') / ('writer-service.exe' if sys.platform == 'win32' else 'writer-service'); subprocess.run([sys.executable, 'tests/verify_writing_sessions.py', '--service', str(service.resolve())], check=True)"
      - name: Frozen comparison drafts, adoption and restart
        run: python -c "import pathlib, subprocess, sys; service = pathlib.Path('build/backend') / ('writer-service.exe' if sys.platform == 'win32' else 'writer-service'); subprocess.run([sys.executable, 'tests/verify_comparison_frozen.py', '--service', str(service.resolve())], check=True)"
      - name: Frozen Skills on a clean computer
        run: python -c "import pathlib, subprocess, sys; service = pathlib.Path('build/backend') / ('writer-service.exe' if sys.platform == 'win32' else 'writer-service'); subprocess.run([sys.executable, 'tests/verify_skills_frozen.py', '--service', str(service.resolve())], check=True)"
      - name: Verify actual installer on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/verify-installer.py
      - name: Verify actual installer on Windows and macOS
        if: runner.os != 'Linux'
        run: python scripts/verify-installer.py
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/WriterDesk-*.deb
            dist/WriterDesk-*.exe
            dist/WriterDesk-*.dmg
            dist/WriterDesk-*.tar.gz
            dist/WriterDesk-*.sha256
            dist/installer-smoke.json
            dist/update-installer-native.json
            dist/update-installer-electron.json
            dist/immersive-native-regression.json
            dist/immersive-writing-regression.json
            dist/editor-layout-regression.json
            dist/review-jump-regression.json
            dist/editor-tools-regression.json
            dist/formatted-export-regression.json
            dist/expansion-workflow-regression.json
            dist/home-dashboard-regression.json
            dist/interface-polish-regression.json
            dist/comparison-drafts-regression.json
            dist/character-growth-regression.json
            dist/skills-workflow-regression.json
            dist/linux-tar-verification.json
      - name: Upload failed native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            dist/*smoke*.json
            dist/update-installer-native.json
            dist/update-installer-electron.json
            dist/immersive-native-regression.json
            dist/immersive-writing-regression.json
            dist/immersive-writing-regression.png
            dist/linux-tar-*.json
            dist/linux-tar-*.log
            dist/editor-layout-regression.json
            dist/review-jump-regression.json
            dist/editor-tools-regression.json
            dist/formatted-export-regression.json
            dist/expansion-workflow-regression.json
            dist/home-dashboard-regression.json
            dist/interface-polish-regression.json
            dist/comparison-drafts-regression.json
            dist/character-growth-regression.json
            dist/skills-workflow-regression.json
            dist/expansion-workflow-regression.png
            dist/home-dashboard-regression.png
            dist/interface-polish-regression.png
            dist/builder-debug.yml
            build/backend/build-info.json

  draft-release:
    name: Collect verified packages into draft release
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-output
      - name: Check reports and installer checksums
        run: |
          python tests/verify_native_release.py
          python scripts/collect-native-release.py native-output release-assets
      - name: Create or update draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          tag = 'v' + os.environ['RELEASE_VERSION']
          existing = subprocess.run(['gh', 'release', 'view', tag, '--json', 'isDraft,targetCommitish'], capture_output=True, text=True)
          if existing.returncode == 0:
              release = json.loads(existing.stdout)
              if not release['isDraft'] or release['targetCommitish'] != os.environ['RELEASE_SHA']:
                  raise SystemExit('Refusing to replace a published release or another source commit')
          else:
              subprocess.run(['gh', 'release', 'create', tag, '--target', os.environ['RELEASE_SHA'], '--draft', '--title', "作家工作台 · Writer's Desk " + os.environ['RELEASE_VERSION'], '--notes-file', 'release-assets/release-notes.md'], check=True)
          from pathlib import Path
          assets = [str(path) for path in sorted(Path('release-assets').iterdir()) if path.name != 'release-notes.md']
          subprocess.run(['gh', 'release', 'upload', tag, '--clobber', *assets], check=True)
          print('Verified packages saved to draft release ' + tag + '; publication is a separate action.')
          PY
